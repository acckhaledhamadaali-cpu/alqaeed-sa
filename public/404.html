<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة | 404 | القائد للإدارة المالية</title>
    <meta name="description" content="عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Simplified Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        background-color: #F8FAFC;
        color: #0F172A;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        line-height: 1.6;
        direction: rtl;
        text-align: center;
      }
      .card {
        background-color: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        max-width: 520px;
        width: 100%;
        padding: 48px 32px;
      }
      .badge {
        display: inline-block;
        background-color: #F1F5F9;
        color: #0F172A;
        font-size: 13px;
        padding: 4px 14px;
        border-radius: 9999px;
        border: 1px solid #E2E8F0;
        margin-bottom: 20px;
      }
      .code-display {
        font-size: 64px;
        font-weight: 900;
        color: #0F172A;
        line-height: 1;
        margin-bottom: 12px;
        letter-spacing: -1px;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #0F172A;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        color: #475569;
        margin-bottom: 32px;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: all 150ms ease-in-out;
        cursor: pointer;
      }
      .btn-primary {
        background-color: #0F172A;
        color: #FFFFFF;
        border: 1px solid #0F172A;
      }
      .btn-primary:hover {
        background-color: #1E293B;
        border-color: #1E293B;
      }
      .btn-outline {
        background-color: #FFFFFF;
        color: #0F172A;
        border: 1px solid #E2E8F0;
      }
      .btn-outline:hover {
        border-color: #0F172A;
        background-color: #F8FAFC;
      }
      .brand-footer {
        margin-top: 28px;
        font-size: 12px;
        color: #94A3B8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">خطأ في التوجيه</span>
      <div class="code-display">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>
        عذراً، الرابط الذي تحاول الوصول إليه غير متوفر أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية أو استكشاف موضوعاتنا في المكتبة المالية.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">
          العودة للرئيسية
        </a>
        <a href="/blog" class="btn btn-outline">
          المكتبة المالية
        </a>
      </div>
      <div class="brand-footer">
        القائد للإدارة المالية المتكاملة للمنشآت
      </div>
    </main>
  </body>
</html>
